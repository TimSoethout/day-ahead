name: Build and publish

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.arch }} ${{ matrix.release }} release
    strategy:
      matrix:
        release: [ "stable", "testing" ]
        arch: [ "aarch64", "amd64"]
    permissions:
      contents: read
      packages: write

    steps:
      # this will always checkout the triggered release tag
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get version to build
        run: |
          if [[ ${{ matrix.release }} == "stable" ]]; then
            VERSION=$(grep 'version: ' dao/config.yaml | sed -e 's/^version: //')
          else
            VERSION=$(grep 'version: ' ./release-testing/config.yaml | sed -e 's/^version: //') 
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set stable or testing on release
        if: ${{ github.ref_name == env.VERSION }}
        shell: bash
        run: |
          if [[ ${{ matrix.release }} == "stable" ]]; then
            echo "this is a final release, setting stable tag"
            echo "NO_LATEST=" >> $GITHUB_ENV;
            echo "EXTRA_TAG=--additional-tag stable" >> $GITHUB_ENV
            echo "TARGET=--target dao" >> $GITHUB_ENV
          else
            echo "this is a release candidate, not setting stable or latest tag"
            echo "NO_LATEST=--no-latest" >> $GITHUB_ENV;
            echo "EXTRA_TAG=--additional-tag testing" >> $GITHUB_ENV;
            echo "TARGET=--target release-testing" >> $GITHUB_ENV
          fi 

      - name: Login to GHCR
        if: ${{ github.ref_name == env.VERSION }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io


      - name: Prepare ${{ matrix.release }} build
        if: ${{ github.ref_name == env.VERSION }}
        run: |
          if [[ ${{ matrix.release }} == "testing" ]]; then
             cp -a dao/. ./release-${{ matrix.release }}
          fi

      - name: Build and publish ${{ matrix.release }} dao-image
        if: ${{ github.ref_name == env.VERSION }}
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            --generic $VERSION \
            --${{ matrix.arch }} \
            --image "dao-${{ matrix.arch }}" \
            ${{ env.TARGET }} \
            --version $VERSION \
            --docker-hub ghcr.io/${{ github.repository_owner }} \
            ${{ env.NO_LATEST }} \
            ${{ env.EXTRA_TAG }} \
            --addon

      - name: Validate add-on image metadata and size
        if: ${{ github.ref_name == env.VERSION }}
        env:
          MAX_IMAGE_SIZE_BYTES: ${{ vars.DAO_MAX_IMAGE_SIZE_BYTES }}
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image ls --quiet \
            --filter "label=io.hass.arch=${{ matrix.arch }}" \
            --filter "label=io.hass.version=${VERSION}" | head -n1)"
          if [[ -z "${IMAGE_ID}" ]]; then
            echo "No image found by expected labels; available images:"
            docker image ls
            exit 1
          fi

          HASS_TYPE="$(docker image inspect "${IMAGE_ID}" --format '{{index .Config.Labels "io.hass.type"}}')"
          if [[ "${HASS_TYPE}" != "addon" ]]; then
            echo "Invalid io.hass.type label: ${HASS_TYPE}"
            exit 1
          fi

          ENTRYPOINT="$(docker image inspect "${IMAGE_ID}" --format '{{json .Config.Entrypoint}}')"
          if [[ "${ENTRYPOINT}" != *"run.sh"* ]]; then
            echo "Unexpected entrypoint: ${ENTRYPOINT}"
            exit 1
          fi

          SIZE_BYTES="$(docker image inspect "${IMAGE_ID}" --format '{{.Size}}')"
          SIZE_MIB="$((SIZE_BYTES / 1024 / 1024))"
          echo "release=${{ matrix.release }} arch=${{ matrix.arch }} image_id=${IMAGE_ID} size_bytes=${SIZE_BYTES} size_mib=${SIZE_MIB}"
          {
            echo "### Image size"
            echo "- Release: \`${{ matrix.release }}\`"
            echo "- Arch: \`${{ matrix.arch }}\`"
            echo "- Image ID: \`${IMAGE_ID}\`"
            echo "- Size: \`${SIZE_BYTES}\` bytes (~${SIZE_MIB} MiB)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${MAX_IMAGE_SIZE_BYTES:-}" =~ ^[1-9][0-9]*$ ]] && (( SIZE_BYTES > MAX_IMAGE_SIZE_BYTES )); then
            echo "Image size ${SIZE_BYTES} exceeds configured max ${MAX_IMAGE_SIZE_BYTES} bytes"
            exit 1
          fi
